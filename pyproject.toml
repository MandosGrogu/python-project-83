[project]
name = "hexlet-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncio>=4.0.0",
    "asyncpg>=0.31.0",
    "bs4>=0.0.2",
    "dotenv>=0.9.9",
    "flask[async]>=3.1.3",
    "gunicorn>=26.0.0",
    "psycopg2>=2.9.12",
    "requests>=2.34.2",
    "validators>=0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]

[project.scripts] 
app = "page_analyzer:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
